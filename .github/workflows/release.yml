# Tag-triggered release pipeline: push a `vX.Y.Z[-suffix]` tag and this
# builds the signed NSIS installer, publishes the GitHub release (pre-release
# when the version has a `-suffix`), and refreshes the rolling updater
# feed(s) apps poll. Two rolling releases exist (`updater-beta` refreshed on
# every tag, `updater` refreshed only on a plain non-suffixed tag) so the
# Settings "Beta channel" toggle can opt a user into pre-releases without
# ever pushing a beta build to a stable-channel install — see lib.rs's
# STABLE/BETA_UPDATER_ENDPOINT. Rolling releases (rather than GitHub's
# /releases/latest) exist because that endpoint ignores pre-releases, which
# is all a beta program ever publishes.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      # Restores the release-profile cache release-cache.yml saves from main.
      # Never saves: a tag-scoped cache can't be read by any later tag.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release
          save-if: false
      # A tag that doesn't match the manifests would ship an installer whose
      # embedded version disagrees with its release page — and the updater
      # feed compares versions, so the mismatch would confuse every install.
      - name: Guard - tag matches manifests
        shell: bash
        run: |
          PKG=$(node -p "require('./package.json').version")
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          [ "v$PKG" = "$GITHUB_REF_NAME" ] && [ "$PKG" = "$CONF" ] || {
            echo "Tag $GITHUB_REF_NAME vs package.json $PKG vs tauri.conf.json $CONF mismatch"; exit 1; }
      # A release must never ship from a commit whose checks were red. ci.yml
      # already runs every check (incl. cargo test, clippy, visual) on each
      # push to main, so wait for that run instead of recompiling the whole
      # crate graph in debug just for cargo test.
      - name: Guard - CI passed on this commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 12); do
            RUN=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --event push --limit 1 --json databaseId -q '.[0].databaseId')
            [ -n "$RUN" ] && break
            sleep 10
          done
          [ -n "$RUN" ] || { echo "No ci.yml push run for $GITHUB_SHA: push the commit to main before tagging."; exit 1; }
          gh run watch "$RUN" --exit-status --interval 30 > /dev/null || {
            echo "ci.yml run $RUN did not succeed for $GITHUB_SHA: fix CI before tagging."; exit 1; }
      - run: npm ci
      # The release body = this version's CHANGELOG.md section (the same
      # text the in-app "Quoi de neuf" panel shows). Missing section fails
      # the build: every release must have written patch notes.
      - name: Extract release notes from CHANGELOG.md
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## "ver"$" { hit=1; next }
            /^## / { hit=0 }
            hit { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > "$RUNNER_TEMP/release-notes.md"
          [ -s "$RUNNER_TEMP/release-notes.md" ] || {
            echo "No '## $VERSION' section found in CHANGELOG.md — write the patch notes before tagging."; exit 1; }
          {
            echo "RELEASE_NOTES<<NOTES_EOF"
            cat "$RUNNER_TEMP/release-notes.md"
            echo "NOTES_EOF"
          } >> "$GITHUB_ENV"
      - run: npm run test
      - run: npm run verify-adapter
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: ${{ env.RELEASE_NOTES }}
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
      - name: Refresh rolling updater feed(s)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern latest.json --dir "$RUNNER_TEMP"

          # Beta feed: every tag lands here, stable or not — betas are a
          # superset of what a beta-channel opt-in user should see.
          gh release view updater-beta >/dev/null 2>&1 || gh release create updater-beta --prerelease \
            --title "Updater feed - beta channel (ne pas installer depuis ici)" \
            --notes "Flux latest.json du canal beta (Réglages → Beta channel). Installez l'application depuis les releases versionnées."
          gh release upload updater-beta "$RUNNER_TEMP/latest.json" --clobber

          # Stable feed: only a plain, non-suffixed tag — a beta tag must
          # never move a stable-channel install onto a beta build.
          if [[ "$GITHUB_REF_NAME" != *-* ]]; then
            gh release view updater >/dev/null 2>&1 || gh release create updater --prerelease \
              --title "Updater feed - stable channel (ne pas installer depuis ici)" \
              --notes "Flux latest.json du canal stable. Installez l'application depuis les releases versionnées."
            gh release upload updater "$RUNNER_TEMP/latest.json" --clobber
          fi
